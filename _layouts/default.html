<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">~/</span>{{ site.title }}
      </a>
      <nav class="nav-links">
        <a href="{{ '/' | relative_url }}">Writing</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="page">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>© {{ site.time | date: "%Y" }} {{ site.author }}</span>
      <span class="footer-sep">·</span>
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">github.com/{{ site.github_username }}</a>
      <span class="footer-sep">·</span>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </footer>
</body>
</html>
