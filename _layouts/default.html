<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-path">~/</span>miguel</a>
      <nav class="nav-links">
        <a href="{{ '/' | relative_url }}">writing</a>
        <a href="{{ '/about/' | relative_url }}">about</a>
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">github</a>
      </nav>
    </div>
  </header>

  <main class="page">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span class="comment"># © {{ site.time | date: "%Y" }} {{ site.author }}</span>
      <span class="footer-links">
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">github.com/{{ site.github_username }}</a>
        <a href="{{ '/feed.xml' | relative_url }}">rss</a>
      </span>
    </div>
  </footer>
</body>
</html>
