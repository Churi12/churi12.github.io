---
layout: default
---

<section class="hero">
  <h1 class="hero-title">{{ site.title }}</h1>
  <p class="hero-tagline">{{ content | strip_html | strip }}</p>
</section>

<section class="post-feed">
  {% for post in site.posts %}
  <article class="post-card">
    <a class="post-card-link" href="{{ post.url | relative_url }}">
      <time class="post-card-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
      <h2 class="post-card-title">{{ post.title }}</h2>
      <p class="post-card-excerpt">{{ post.excerpt | strip_html | truncate: 180 }}</p>
      <span class="post-card-more">Read &rarr;</span>
    </a>
  </article>
  {% endfor %}
</section>
